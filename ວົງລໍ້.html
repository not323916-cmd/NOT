<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ວົງລໍ້ຍາມກິນເບຍ</title>

    <link rel="stylesheet" href="ວົງລໍ້.css">
</head>

<body>

<div class="container">

    <h1>🍻 ວົງລໍ້ຍາມກິນເບຍ 🍻</h1>

    <!-- วงล้อ -->
    <div class="wheel-box">

        <div class="pointer"></div>

        <canvas id="wheel"></canvas>

    </div>

    <!-- ปุ่มหมุน -->
    <button id="spinBtn" onclick="spinWheel()">
        🍺 ສູ່ມ 🍺
    </button>

    <!-- ผลรางวัลล่าสุด -->
    <div class="result" id="result">
        ກົດສູ່ມ
    </div>


    <!-- ประวัติการสุ่ม -->
    <div class="history-box">

        <div class="history-title">
            📜 ປະຫວັດການສຸ່ມລ່າສຸດ 📜
        </div>

        <div id="historyList">
            <div class="empty-history">
                ຍັງບໍ່ມີປະຫວັດການສຸ່ມ
            </div>
        </div>

        <button
            class="clear-history-btn"
            onclick="clearHistory()">
            🗑️ ລ້າງປະຫວັດ
        </button>

    </div>


    <!-- แก้ไขรางวัล -->
    <div class="edit-box">

        <h2>🎁 ລາຍການ 🎁</h2>

        <div id="prizeList"></div>

        <!-- เพิ่มช่อง -->
        <button class="add-btn" onclick="addPrize()">
            ➕ ເພີ່ມ
        </button>

        <br>

        <!-- อัปเดต -->
        <button class="update-btn" onclick="updateWheel()">
            🔄 ອັບເດດ
        </button>

    </div>

</div>


<script>

const canvas =
    document.getElementById("wheel");

const ctx =
    canvas.getContext("2d");


// =====================================
// รายการรางวัล
// =====================================

let prizes = [
    "ລອດ",
    "ກິນເບຶດຈອກ",
    "ກິນເຄິ່ງຈອກ",
    "ບອກຫມູ່ເບິດຈອກຄົນ 1",
    "ບອກຫມູ່ເບີດພ້ອມກັບໂຕເອງເບິດຈອກ",
    "ຄົນທີຢູູ່ຂ້າງຂ້າຍເບິດຈອກ",
    "ຄົນທີຢູ່ຂ້າງຂວາເບິດຈອກ",
    "ກິນພ້ອມກັນເບິດວົງ ເບິດຈອກ"
];


let rotation = 0;

let spinning = false;


// =====================================
// ประวัติ
// =====================================

let history = [];


// =====================================
// สีวงล้อ
// =====================================

const colors = [

    "#ff5252",

    "#ff9800",

    "#ffeb3b",

    "#4caf50",

    "#00bcd4",

    "#2196f3",

    "#673ab7",

    "#e91e63",

    "#795548",

    "#009688"

];


// =====================================
// สร้างช่องรางวัล
// =====================================

function createPrizeInputs() {

    const list =
        document.getElementById(
            "prizeList"
        );


    list.innerHTML = "";


    prizes.forEach(
        (prize, index) => {

            const row =
                document.createElement(
                    "div"
                );


            row.className =
                "prize-row";


            row.innerHTML = `

                <input
                    type="text"
                    class="prize-input"
                    value="${escapeHtml(prize)}"
                    placeholder="ชื่อรางวัล"
                >

                <button
                    class="delete-btn"
                    onclick="deletePrize(${index})">
                    🗑️
                </button>

            `;


            list.appendChild(row);

        }
    );

}


// =====================================
// ป้องกัน HTML แปลก ๆ ในช่องรางวัล
// =====================================

function escapeHtml(text) {

    return text
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


// =====================================
// เพิ่มรางวัล
// =====================================

function addPrize() {

    prizes.push(
        "ລາງວັນໃໝ່"
    );


    createPrizeInputs();

}


// =====================================
// ลบรางวัล
// =====================================

function deletePrize(index) {

    if (prizes.length <= 2) {

        alert(
            "ต้องมีรางวัลอย่างน้อย 2 รายการ"
        );

        return;
    }


    prizes.splice(index, 1);


    createPrizeInputs();

}


// =====================================
// อัปเดตวงล้อ
// =====================================

function updateWheel() {

    const inputs =
        document.querySelectorAll(
            ".prize-input"
        );


    let newPrizes = [];


    inputs.forEach(
        input => {

            const text =
                input.value.trim();


            if (text !== "") {

                newPrizes.push(text);

            }

        }
    );


    if (newPrizes.length < 2) {

        alert(
            "กรุณาใส่รางวัลอย่างน้อย 2 รายการ"
        );

        return;
    }


    prizes = newPrizes;


    rotation = 0;


    drawWheel();


    document.getElementById(
        "result"
    ).innerHTML =
        "กดปุ่มเพื่อสุ่มรางวัล 🎯";

}


// =====================================
// วาดวงล้อ
// =====================================

function drawWheel() {

    const center =
        canvas.width / 2;


    const radius =
        center - 5;


    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    const angle =
        (Math.PI * 2) /
        prizes.length;


    for (
        let i = 0;
        i < prizes.length;
        i++
    ) {

        const start =
            rotation +
            i * angle;


        const end =
            start + angle;


        // ช่องสี

        ctx.beginPath();


        ctx.moveTo(
            center,
            center
        );


        ctx.arc(
            center,
            center,
            radius,
            start,
            end
        );


        ctx.closePath();


        ctx.fillStyle =
            colors[
                i % colors.length
            ];


        ctx.fill();


        ctx.strokeStyle =
            "#ffffff";


        ctx.lineWidth = 4;


        ctx.stroke();


        // ข้อความ

        ctx.save();


        ctx.translate(
            center,
            center
        );


        ctx.rotate(
            start +
            angle / 2
        );


        ctx.fillStyle =
            "#ffffff";


        ctx.font =
            "bold 20px 'Phetsarath OT', Arial";


        ctx.textAlign =
            "right";


        ctx.textBaseline =
            "middle";


        let text =
            prizes[i];


        if (text.length > 18) {

            text =
                text.substring(
                    0,
                    18
                ) + "...";

        }


        ctx.fillText(
            text,
            radius - 25,
            0
        );


        ctx.restore();

    }


    // =================================
    // วงกลมตรงกลาง
    // =================================

    ctx.beginPath();


    ctx.arc(
        center,
        center,
        45,
        0,
        Math.PI * 2
    );


    ctx.fillStyle =
        "#ffffff";


    ctx.fill();


    ctx.strokeStyle =
        "#ddd";


    ctx.lineWidth = 3;


    ctx.stroke();


    ctx.fillStyle =
        "#333";


    ctx.font =
        "bold 18px Arial";


    ctx.textAlign =
        "center";


    ctx.textBaseline =
        "middle";


    ctx.fillText(
        "SPIN",
        center,
        center
    );

}


// =====================================
// หมุนวงล้อ
// =====================================

function spinWheel() {

    if (spinning) return;


    spinning = true;


    const button =
        document.getElementById(
            "spinBtn"
        );


    button.disabled = true;


    document.getElementById(
        "result"
    ).innerHTML =
        "🎡 กำลังหมุน...";


    // สุ่มรางวัล

    const winner =
        Math.floor(
            Math.random() *
            prizes.length
        );


    const angle =
        (Math.PI * 2) /
        prizes.length;


    // จุดกลางช่องที่สุ่มได้

    const winnerAngle =
        winner * angle +
        angle / 2;


    const targetAngle =
        Math.PI * 1.5 -
        winnerAngle;


    const currentAngle =
        rotation %
        (Math.PI * 2);


    let difference =
        targetAngle -
        currentAngle;


    if (difference < 0) {

        difference +=
            Math.PI * 2;

    }


    // หมุน 5-7 รอบ

    const rounds =
        5 +
        Math.floor(
            Math.random() * 3
        );


    const startRotation =
        rotation;


    const targetRotation =
        rotation +
        rounds * Math.PI * 2 +
        difference;


    const duration =
        5000;


    const startTime =
        performance.now();


    function animate(time) {

        const elapsed =
            time - startTime;


        let progress =
            elapsed / duration;


        if (progress > 1) {

            progress = 1;

        }


        // ทำให้ตอนท้ายช้าลง

        const easeOut =
            1 -
            Math.pow(
                1 - progress,
                4
            );


        rotation =
            startRotation +
            (
                targetRotation -
                startRotation
            ) *
            easeOut;


        drawWheel();


        if (progress < 1) {

            requestAnimationFrame(
                animate
            );

        } else {

            rotation =
                rotation %
                (Math.PI * 2);


            // แสดงผล

            document.getElementById(
                "result"
            ).innerHTML =

                "🏆 ได้รับรางวัล<br>" +

                "<strong>" +

                prizes[winner] +

                "</strong> 🎉";


            // เพิ่มประวัติ

            addHistory(
                prizes[winner]
            );


            spinning = false;


            button.disabled = false;

        }

    }


    requestAnimationFrame(
        animate
    );

}


// =====================================
// เพิ่มประวัติ
// =====================================

function addHistory(prize) {

    // เพิ่มรายการใหม่ไว้ด้านหน้า

    history.unshift(prize);


    // เก็บสูงสุด 20 รายการ

    if (history.length > 20) {

        history.pop();

    }


    showHistory();

}


// =====================================
// แสดงประวัติ
// =====================================

function showHistory() {

    const list =
        document.getElementById(
            "historyList"
        );


    list.innerHTML = "";


    if (history.length === 0) {

        list.innerHTML = `
            <div class="empty-history">
                ยังไม่มีประวัติการสุ่ม
            </div>
        `;

        return;
    }


    history.forEach(
        (prize, index) => {

            const item =
                document.createElement(
                    "div"
                );


            item.className =
                "history-item";


            item.innerHTML = `

                <span class="history-number">
                    ${index + 1}
                </span>

                <span class="history-prize">
                    ${escapeHtml(prize)}
                </span>

            `;


            list.appendChild(item);

        }
    );

}


// =====================================
// ล้างประวัติ
// =====================================

function clearHistory() {

    if (history.length === 0) {

        return;

    }


    const confirmClear =
        confirm(
            "ต้องการล้างประวัติทั้งหมดหรือไม่?"
        );


    if (!confirmClear) return;


    history = [];


    showHistory();

}


// =====================================
// ขนาด Canvas
// =====================================

function resizeCanvas() {

    canvas.width = 500;

    canvas.height = 500;


    drawWheel();

}


window.addEventListener(
    "resize",
    resizeCanvas
);


// =====================================
// เริ่มต้น
// =====================================

createPrizeInputs();

resizeCanvas();

showHistory();

</script>

</body>
</html>
